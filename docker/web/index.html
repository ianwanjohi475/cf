<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Phone</title>
<style>
  :root { --bg:#111; --bar:#1c1c1e; --text:#eee; --muted:#9a9aa0; --accent:#1a73e8; --ok:#34a853; --err:#ea4335; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui, sans-serif; }
  body { display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--bar); flex-wrap:wrap; }
  header.drag { outline:2px dashed var(--accent); outline-offset:-4px; }
  h1 { font-size:15px; margin:0 8px 0 0; font-weight:600; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:7px 12px; font-size:14px; cursor:pointer; }
  button.secondary { background:#3a3a3c; }
  button:disabled { opacity:.5; cursor:default; }
  #status { font-size:13px; color:var(--muted); flex:1; min-width:180px; }
  #status.ok { color:var(--ok); } #status.err { color:var(--err); }
  progress { width:120px; display:none; }
  button.on { background:var(--err); }
  #preview { width:64px; height:48px; object-fit:cover; border-radius:4px; background:#000; display:none; transform:scaleX(-1); }
  iframe { flex:1; width:100%; border:0; }
</style>
</head>
<body>
<header id="bar">
  <h1>Cloud Phone</h1>
  <button id="pickMedia">Upload photo / video</button>
  <button id="pickAny" class="secondary">Upload file</button>
  <button id="cameraBtn" class="secondary" title="Use this device's webcam as the phone's camera">Camera: off</button>
  <button id="camFileBtn" class="secondary" title="Use a photo or video from your PC as the phone's camera">Use as camera</button>
  <video id="preview" muted playsinline></video>
  <button id="pasteBtn" class="secondary" title="Type or paste text to send into the phone">Paste text</button>
  <input id="mediaInput" type="file" accept="image/*,video/*" multiple hidden>
  <input id="anyInput" type="file" multiple hidden>
  <input id="camFileInput" type="file" accept="image/*,video/*" hidden>
  <progress id="progress" max="100" value="0"></progress>
  <span id="status">Ctrl+V pastes your PC clipboard into the phone. Drop files on this bar to upload.</span>
</header>
<iframe id="screen" src="novnc/vnc.html?autoconnect=1&resize=scale&reconnect=1&reconnect_delay=2000&show_dot=1&path=websockify" allow="clipboard-read; clipboard-write"></iframe>
<script>
  const statusEl = document.getElementById('status');
  const progress = document.getElementById('progress');
  const buttons = [document.getElementById('pickMedia'), document.getElementById('pickAny')];

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = kind || '';
  }

  function upload(files) {
    if (!files.length) return;
    const form = new FormData();
    for (const f of files) form.append('file', f, f.name);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', 'upload');
    xhr.upload.onprogress = e => { if (e.lengthComputable) progress.value = 100 * e.loaded / e.total; };
    xhr.onload = () => {
      let res = {};
      try { res = JSON.parse(xhr.responseText); } catch (e) {}
      if (xhr.status === 200) {
        const where = [...new Set(res.saved.map(s => s.folder))].join(', ');
        setStatus(`Sent ${res.saved.length} file(s) to the phone (${where}). Pick it from Gallery / Files.`, 'ok');
      } else {
        setStatus(res.error || `Upload failed (${xhr.status}).`, 'err');
      }
      done();
    };
    xhr.onerror = () => { setStatus('Upload failed: connection lost.', 'err'); done(); };
    progress.value = 0;
    progress.style.display = 'inline-block';
    buttons.forEach(b => b.disabled = true);
    setStatus(`Uploading ${files.length} file(s)...`);
    xhr.send(form);
  }

  function done() {
    progress.style.display = 'none';
    buttons.forEach(b => b.disabled = false);
    document.getElementById('screen').focus();
  }

  for (const [btn, input] of [['pickMedia', 'mediaInput'], ['pickAny', 'anyInput']]) {
    const el = document.getElementById(input);
    document.getElementById(btn).onclick = () => el.click();
    el.onchange = () => { upload([...el.files]); el.value = ''; };
  }

  // ---------------------------------------------------------- clipboard
  const screenFrame = document.getElementById('screen');
  let lastPhoneClip = null;
  let lastSentClip = null;

  async function sendToPhone(text) {
    lastSentClip = text;
    const r = await fetch('clipboard', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text, paste: true}),
    });
    setStatus(r.ok ? 'Pasted into the phone.' : 'Paste failed.', r.ok ? 'ok' : 'err');
  }

  async function pasteFromPC() {
    try {
      const text = await screenFrame.contentWindow.navigator.clipboard.readText();
      if (text) await sendToPhone(text);
    } catch (e) {
      setStatus('Allow clipboard access for this page (icon in the address bar), or use "Paste text".', 'err');
    }
  }

  screenFrame.addEventListener('load', () => {
    screenFrame.contentDocument.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === 'v') {
        e.preventDefault();
        e.stopImmediatePropagation();
        pasteFromPC();
      }
    }, true);
  });

  document.getElementById('pasteBtn').onclick = () => {
    const text = prompt('Text to paste into the phone (tap a text box in the phone first):');
    if (text) sendToPhone(text);
  };

  async function copyToPC(text) {
    for (const nav of [screenFrame.contentWindow.navigator, navigator]) {
      try { await nav.clipboard.writeText(text); return true; } catch (e) {}
    }
    return false;
  }

  async function pollPhoneClipboard() {
    try {
      const {text} = await (await fetch('clipboard')).json();
      if (lastPhoneClip !== null && text && text !== lastPhoneClip && text !== lastSentClip) {
        if (await copyToPC(text)) {
          setStatus('Copied from the phone to your PC clipboard.', 'ok');
        } else {
          setStatus('Phone copied text. Click here to copy it to your PC.', 'ok');
          statusEl.onclick = async () => { await copyToPC(text); statusEl.onclick = null; setStatus('Copied.', 'ok'); };
        }
      }
      lastPhoneClip = text;
    } catch (e) {}
    setTimeout(pollPhoneClipboard, 1500);
  }
  pollPhoneClipboard();

  // ------------------------------------------------------------- camera (webcam)
  const cameraBtn = document.getElementById('cameraBtn');
  const preview = document.getElementById('preview');
  const canvas = document.createElement('canvas');
  canvas.width = 640; canvas.height = 480;
  let cam = null;

  async function cameraOn() {
    if (!window.isSecureContext || !navigator.mediaDevices) {
      setStatus('The browser only allows the webcam on http://localhost or an https:// address.', 'err');
      return;
    }
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({video: {width: {ideal: 640}, height: {ideal: 480}}, audio: false});
    } catch (e) {
      setStatus('Webcam blocked or not found: ' + e.message, 'err');
      return;
    }
    preview.srcObject = stream;
    preview.style.display = 'inline-block';
    await preview.play();
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host +
                             location.pathname.replace(/[^/]*$/, '') + 'camera');
    const ctx = canvas.getContext('2d');
    const timer = setInterval(() => {
      if (ws.readyState !== WebSocket.OPEN || ws.bufferedAmount > 500000 || !preview.videoWidth) return;
      const vw = preview.videoWidth, vh = preview.videoHeight;
      const sw = Math.min(vw, vh * 4 / 3), sh = sw * 3 / 4;
      ctx.drawImage(preview, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, 640, 480);
      canvas.toBlob(b => { if (b && ws.readyState === WebSocket.OPEN) ws.send(b); }, 'image/jpeg', 0.75);
    }, 1000 / 15);
    ws.onclose = () => { if (cam && cam.ws === ws) cameraOff('Camera connection lost.'); };
    cam = {stream, ws, timer};
    cameraBtn.textContent = 'Camera: ON';
    cameraBtn.classList.add('on');
    setStatus('Live webcam is on. All apps in the phone see your webcam.', 'ok');
  }

  function cameraOff(message) {
    if (!cam) return;
    clearInterval(cam.timer);
    cam.stream.getTracks().forEach(t => t.stop());
    const ws = cam.ws;
    cam = null;
    ws.close();
    preview.style.display = 'none';
    cameraBtn.textContent = 'Camera: off';
    cameraBtn.classList.remove('on');
    setStatus(message || 'Camera off.');
  }

  cameraBtn.onclick = async () => {
    if (cam) return cameraOff();
    try {
      const st = await (await fetch('status')).json();
      if (!st.camera) return setStatus(st.problem, 'err');
    } catch (e) {}
    cameraOn();
  };

  // ------------------------------------------------------------- camera (file mode)
  // Pick a photo or video from your PC; it loops as the phone's camera feed.
  // Any app (WhatsApp, Meet, Camera) that opens the camera sees it.
  const camFileBtn = document.getElementById('camFileBtn');
  const camFileInput = document.getElementById('camFileInput');

  camFileBtn.onclick = async () => {
    // If already in file mode, clicking again clears it.
    if (camFileBtn.classList.contains('on')) {
      camFileBtn.disabled = true;
      try {
        await fetch('camera-source', {method: 'DELETE'});
      } catch (e) {}
      camFileBtn.textContent = 'Use as camera';
      camFileBtn.classList.remove('on');
      camFileBtn.disabled = false;
      setStatus('Camera source cleared. Phone is back to placeholder / webcam.');
      return;
    }
    // Check camera device is ready before picking a file.
    try {
      const st = await (await fetch('status')).json();
      if (!st.camera) return setStatus(st.problem, 'err');
    } catch (e) {}
    camFileInput.click();
  };

  camFileInput.onchange = async () => {
    const file = camFileInput.files[0];
    camFileInput.value = '';
    if (!file) return;

    // Turn off live webcam if it's running; both modes write to the same device.
    if (cam) cameraOff();

    setStatus(`Uploading "${file.name}" as camera source…`);
    camFileBtn.disabled = true;

    const form = new FormData();
    form.append('file', file, file.name);
    try {
      const r = await fetch('camera-source', {method: 'POST', body: form});
      const res = await r.json();
      if (!r.ok) {
        setStatus(res.error || `Upload failed (${r.status}).`, 'err');
        camFileBtn.disabled = false;
        return;
      }
      const label = res.kind === 'video' ? `Camera: ${file.name.slice(0, 20)}` : `Camera: ${file.name.slice(0, 20)}`;
      camFileBtn.textContent = label + ' ✕';
      camFileBtn.classList.add('on');
      camFileBtn.disabled = false;
      setStatus(
        res.kind === 'video'
          ? `Video "${file.name}" is now the camera. All phone apps see it looping. Click the button again to stop.`
          : `Photo "${file.name}" is now the camera. All phone apps see it. Click the button again to stop.`,
        'ok'
      );
    } catch (e) {
      setStatus('Upload failed: ' + e.message, 'err');
      camFileBtn.disabled = false;
    }
  };

  // ---------------------------------------------------------- drag-and-drop uploads
  const bar = document.getElementById('bar');
  bar.addEventListener('dragover', e => { e.preventDefault(); bar.classList.add('drag'); });
  bar.addEventListener('dragleave', () => bar.classList.remove('drag'));
  bar.addEventListener('drop', e => {
    e.preventDefault();
    bar.classList.remove('drag');
    upload([...e.dataTransfer.files]);
  });
</script>
</body>
</html>
